<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Picker ITF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Navbar -->
    <nav class="navbar">
        <div class="logo">FOODPICKER ITF</div>
        <div class="student-id">68070153</div> <!-- เปลี่ยนเป็นรหัสนักศึกษาของคุณ -->
    </nav>

    <!-- 2. Main Content Container -->
    <main class="container">
        <div class="card">
            <h1 class="title">สุ่มเมนูอาหาร</h1>
            
            <!-- ส่วนแสดงผลข้อมูลอาหาร -->
            <div class="food-display">
                <img id="food-img" src="https://images.unsplash.com/photo-1562967914-608f82629710?w=500" alt="รูปอาหาร">
                <h2 id="food-name">ข้าวมันไก่</h2>
                <p id="food-desc">ข้าวมันหอมๆ เสิร์ฟพร้อมไก่นุ่มและน้ำจิ้มรสเด็ด</p>
                <div id="food-price" class="price">50 - 60 บาท</div>
            </div>

            <!-- 3. ปุ่มกดสุ่ม -->
            <button id="random-btn" onclick="randomFood()">🎲 สุ่มเมนูอาหาร</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
